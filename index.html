<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">


    <!-- 📌 Milestone 3: Usare una Modale per Aggiungere Animali
Partendo da questo componente Modal:

Espandilo affinché:

La vecchia prop content può essere usata per passare un componente qualsiasi.
Un nuovo div in fondo alla modale contiene il bottone Annulla e un nuovo bottone Conferma.
Una nuova prop onConfirm si aspetta una funzione per gestire l’azione di conferma.
Sostituisci l’aggiunta casuale dell’animale con una modale interattiva:
Cliccando il bottone "Aggiungi Animale," si apre una modale.
La modale include un input di testo (passato al prop content) per inserire il nome di un animale.
Conferma: Aggiunge l’animale alla lista e chiude la modale.
Annulla: Chiude la modale senza modificare la lista.

Obiettivo: L’utente può aggiungere animali specifici utilizzando la modale. -->

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const { useState } = React

        const ListaAnimali = () => {
            const [animal, setAnimal] = useState([])
            const [name, setName] = useState("")
            const [showModal, setShowModal] = useState(false)


            const openModal = () => {
                setName("")
                setShowModal(true)
            }

            const closeModal = () => {
                setShowModal(false)
            }

            const confirmAnimal = () => {
                if (name !== "") {
                    setAnimal(curr => [...curr, name])
                }
                setShowModal(false)
            }
        

       
                function Modal({
                        title,
                        content,
                        show = false,
                        onClose = () => { },
                        onConfirm = () => { }
                    }) {
                        return show && ReactDOM.createPortal(
                            <div className="modal-container">
                                <div className="modal">
                                    <h2>{title}</h2>
                                    <div>{content}</div>
                                    <button onClick={onClose}>Annulla</button>
                                    <button onClick={onConfirm}>Conferma</button>
                                </div>
                            </div>,
                            document.body
                        )
                    }
         
            return (
                <>
                    <button onClick={openModal}>Aggiungi Animale</button>

                    <Modal
                    title="Aggiungi un animale"
                    content = {
                        <input
                            type = "text"
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                            placeholder="Gatto"/>
                    }
                    show = {showModal}
                    onClose = {closeModal}
                    onConfirm = {confirmAnimal}
                    />

                    <ul>
                        {animal.map((el, index) => (
                            <li key={index}>{el}</li>
                        ))}
                    </ul>
                </>
            )
        }

        const { createRoot } = ReactDOM
        const listaAnimaliDom = document.querySelector('.lista-animali')
        const root = createRoot(listaAnimaliDom)
        root.render(<ListaAnimali/>)
    </script>
</head>
<body>
    <header>
      <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <div class="lista-animali">

        </div>
    </main>
      <footer>
      <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
  </body>
</html>
