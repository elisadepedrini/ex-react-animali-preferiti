<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">


    <!-- 📌 Milestone 2: Aggiungere Animali Casuali
    Trasforma l’array animals usando useState (l’array è inizialmente vuoto).
    Aggiungi un bottone "Aggiungi Animale" sopra il <details>.
    Cliccando il bottone, un animale casuale viene aggiunto alla lista.
    Usa un array predefinito per scegliere casualmente:

    const animalsChoices = ["Cane", "Gatto", "Pappagallo", "Cavallo", "Panda"];
    L’animale selezionato deve essere aggiunto all’interno della lista <ul> come <li>.

    Obiettivo: L’utente può vedere gli animali aggiunti dinamicamente nella lista. -->

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const { useState } = React

        const ListaAnimali = () => {
            const animalsChoices = ["Cane", "Gatto", "Pappagallo", "Cavallo", "Panda"];
        
        const [animal, setAnimal] = useState([])

        const add = () => {
            const indexRandom = Math.floor(Math.random() * animalsChoices.length)
            const animalRandom = animalsChoices[indexRandom]
            setAnimal(curr => [...curr, animalRandom])
        }

            return(
                <>
                <button onClick={add}>Aggiungi Animale</button>
                <details>
                    <summary>Animali</summary>
                    <p>
                        <ul>
                            {animal.map((el, index) => (
                                <li key={index}>{el}</li>
                            ))}
                        </ul>
                    </p>
                </details>
                </>
            )
        }
        const { createRoot } = ReactDOM
        const listaAnimaliDom = document.querySelector('.lista-animali')
        const root = createRoot(listaAnimaliDom)
        root.render(<ListaAnimali/>)
    </script>
</head>
<body>
    <header>
      <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <div class="lista-animali">

        </div>
    </main>
      <footer>
      <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
  </body>
</html>
